<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuleCrawl — 基于规则的爬虫采集系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="toastContainer" class="toast-container"></div>

    <div id="view-container">
        <!-- 视图 1：项目列表页 (首页) -->
        <div id="view-project-list" class="view-page active">
            <nav class="navbar">
                <div class="navbar-brand"><span class="icon">🕷️</span><span>RuleCrawl</span></div>
                <div class="navbar-actions">
                    <div style="display:flex;align-items:center;gap:8px;margin-right:12px;">
                        <input id="projectSearchInput" class="form-input" placeholder="搜索项目..."
                            onkeyup="if(event.key==='Enter') searchProjects()">
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="showCreateProjectModal()">✨ 新建项目</button>
                </div>
            </nav>
            <div class="container" style="padding: 40px;">
                <h2 style="margin-bottom: 24px; font-weight: 300;">我的项目</h2>
                <div id="projectGrid" class="project-list-container"></div>
                <div id="projectPagination" class="pagination" style="margin-top: 24px; justify-content: center;"></div>
            </div>
        </div>

        <!-- 视图 2：工作区 -->
        <div id="view-workspace" class="view-page" style="display:none;">
            <nav class="navbar">
                <div class="navbar-brand">
                    <button class="btn btn-ghost btn-sm btn-icon" onclick="backToProjects()">⬅</button>
                    <span class="icon">🕷️</span>
                    <span id="workspaceProjectName">项目名称</span>
                </div>
            </nav>

            <div class="main-layout">
                <!-- 左侧侧边栏 -->
                <aside class="sidebar">
                    <div class="sidebar-section">
                        <div class="sidebar-section-title">流程编排</div>
                    </div>
                    <div id="flowPanel" class="flow-panel"></div>

                    <div class="sidebar-footer">
                        <button class="btn btn-success btn-block" onclick="runTask()">🚀 启动任务</button>
                        <button class="btn btn-warning btn-block" onclick="stopTask()">⏹ 停止任务</button>

                        <!-- 独立的数据查看入口 -->
                        <button class="btn btn-outline btn-block"
                            style="margin-top:12px; color:var(--accent-cyan); border-color:var(--accent-cyan);"
                            onclick="loadData(1); switchTab('tab-data')">
                            📊 查看实时采集数据
                        </button>

                        <div style="margin-top:16px; text-align:center;">
                            <div id="taskStatus" style="font-size:13px; font-weight:500;"></div>
                            <div id="taskStats" style="font-size:11px; color:var(--text-dim);"></div>
                        </div>
                    </div>
                </aside>

                <!-- 右侧配置面板 -->
                <main class="main-panel">
                    <div class="tabs-bar" style="display:none;">
                        <button class="tab-btn active" data-tab="tab-start">起始页</button>
                        <button class="tab-btn" data-tab="tab-list">列表页</button>
                        <button class="tab-btn" data-tab="tab-detail">详情页</button>
                        <button class="tab-btn" data-tab="tab-data">数据展示</button>
                    </div>

                    <div class="tab-content">
                        <!-- 起始页 -->
                        <div id="tab-start" class="tab-pane active">
                            <div class="glass-card">
                                <div class="card-title">🚀 起始页配置</div>
                                <div class="form-group"><label>节点名称</label><input id="start-name" class="form-input">
                                </div>
                                <div class="form-row">
                                    <div class="form-group"><label>起始 URL *</label><input id="start-url"
                                            class="form-input"></div>
                                    <div class="form-group"><label>方法</label><select id="start-method"
                                            class="form-select">
                                            <option>GET</option>
                                            <option>POST</option>
                                        </select></div>
                                </div>
                                <div class="form-group"><label>Headers (JSON)</label><textarea id="start-headers"
                                        class="form-textarea"></textarea></div>
                                <div class="form-group"><label>POST Body (JSON/String)</label><textarea id="start-body"
                                        class="form-textarea"></textarea></div>
                                <div id="start-next-step" class="next-step-section"></div>
                            </div>
                            <button class="btn btn-primary" onclick="saveNode('start')">💾 保存配置</button>
                        </div>

                        <!-- 列表页 -->
                        <div id="tab-list" class="tab-pane">
                            <div class="glass-card">
                                <div class="card-title">📋 列表页配置</div>
                                <div class="form-group"><label>节点名称</label><input id="list-name" class="form-input">
                                </div>
                                <div class="form-row">
                                    <div class="form-group" style="flex:2"><label>列表项选择器</label><input
                                            id="list-item-selector" class="form-input"></div>
                                    <div class="form-group"><label>类型</label><select id="list-item-selector-type"
                                            class="form-select">
                                            <option value="xpath">XPath</option>
                                            <option value="css">CSS</option>
                                            <option value="jsonpath">JsonPath</option>
                                            <option value="regex">Regex</option>
                                            <option value="text">Text</option>
                                        </select></div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group"><label>链接选择器</label><input id="list-link-selector"
                                            class="form-input"></div>
                                    <div class="form-group"><label>类型</label><select id="list-link-selector-type"
                                            class="form-select">
                                            <option value="xpath">XPath</option>
                                            <option value="css">CSS</option>
                                            <option value="jsonpath">JsonPath</option>
                                            <option value="regex">Regex</option>
                                            <option value="text">Text</option>
                                        </select></div>
                                </div>
                                <div class="form-group">
                                    <label>透传字段</label>
                                    <div id="list-fields" class="field-list"></div>
                                    <button class="btn btn-ghost btn-sm" onclick="addListField()">➕ 添加字段</button>
                                </div>
                                <div class="form-group"
                                    style="border-top: 1px dashed var(--glass-border); padding-top: 16px;">
                                    <label>🔄 自动翻页</label>
                                    <div class="form-row-3">
                                        <input id="list-pg-selector" class="form-input" placeholder="下一页选择器">
                                        <select id="list-pg-selector-type" class="form-select">
                                            <option value="xpath">XPath</option>
                                            <option value="css">CSS</option>
                                        </select>
                                        <input id="list-pg-max" class="form-input" type="number" value="10">
                                    </div>
                                </div>
                                <div id="list-next-step" class="next-step-section"></div>
                            </div>
                            <button class="btn btn-primary" onclick="saveNode('list')">💾 保存配置</button>
                        </div>

                        <!-- 详情页 -->
                        <div id="tab-detail" class="tab-pane">
                            <div class="glass-card">
                                <div class="card-title">📄 详情页配置</div>
                                <div id="detail-fields" class="field-list"></div>
                                <button class="btn btn-ghost btn-sm" onclick="addDetailField()">➕ 添加字段</button>
                            </div>
                            <div class="glass-card">
                                <div class="card-title">数据去重</div>
                                <div class="form-row">
                                    <select id="detail-dedup-type" class="form-select" onchange="toggleDedupField()">
                                        <option value="none">不去重</option>
                                        <option value="url">按 URL</option>
                                        <option value="field">按字段</option>
                                    </select>
                                    <input id="detail-dedup-field" class="form-input" placeholder="字段名"
                                        style="display:none;">
                                </div>
                            </div>
                            <button class="btn btn-primary" onclick="saveNode('detail')">💾 保存配置</button>
                        </div>

                        <!-- 采集数据展示区 (隐藏标签页，由侧边栏按钮触发) -->
                        <div id="tab-data" class="tab-pane">
                            <div class="glass-card">
                                <div class="card-title">📊 采集数据预览</div>
                                <div style="display:flex;gap:12px;margin-bottom:16px;">
                                    <button class="btn btn-primary btn-sm" onclick="loadData(1)">🔄 刷新</button>
                                    <button class="btn btn-danger btn-sm" onclick="clearData()">🗑️ 清空</button>
                                </div>
                                <div id="dataTableContainer"></div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- 首页数据查看模态框 (修复 ID 缺失问题) -->
        <div id="dataViewModal" class="modal-overlay" style="display:none;">
            <div class="modal-content glass-card"
                style="width:950px; height:85vh; display:flex; flex-direction:column;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <h3 id="dataModalTitle">项目数据</h3>
                    <button class="btn btn-ghost btn-sm" onclick="closeDataViewModal()">✕</button>
                </div>
                <div
                    style="margin-bottom:12px; font-size:13px; color:var(--text-dim); display:flex; justify-content:space-between;">
                    <span>共 <span id="dataModalTotal" style="color:var(--text-primary); font-weight:bold;">0</span>
                        条数据</span>
                    <button class="btn btn-primary btn-xs" onclick="loadModalData(1)">🔄 刷新</button>
                </div>
                <div id="modalDataTableContainer"
                    style="flex:1; overflow-y:auto; border:1px solid var(--glass-border); border-radius:6px;"></div>
                <div id="modalDataPagination" class="pagination" style="margin-top:16px; justify-content:flex-end;">
                </div>
            </div>
        </div>

        <!-- 其他模态框 (保持不变) -->
        <div id="nodeTypeModal" class="modal-overlay" style="display:none;">
            <div class="modal-content glass-card" style="width:300px;text-align:center;">
                <h3>选择子节点</h3>
                <div class="node-type-grid"><button class="btn btn-outline btn-block"
                        onclick="selectNodeType('list')">📋 列表页</button><button class="btn btn-outline btn-block"
                        onclick="selectNodeType('detail')">📄 详情页</button></div><button class="btn btn-ghost btn-sm"
                    onclick="closeNodeTypeModal()" style="margin-top:16px;">取消</button>
            </div>
        </div>
        <div id="createProjectModal" class="modal-overlay" style="display:none;">
            <div class="modal-content glass-card" style="width:400px;">
                <h3>新建项目</h3>
                <div class="form-group"><label>项目名称 *</label><input id="modalProjectName" class="form-input"></div>
                <div class="form-group"><label>项目描述</label><textarea id="modalProjectDesc" class="form-textarea"
                        style="height:80px;"></textarea></div>
                <button class="btn btn-primary btn-block" onclick="confirmCreateProject()">创建</button><button
                    class="btn btn-ghost btn-block" onclick="closeCreateProjectModal()">取消</button>
            </div>
        </div>
        <div id="cleanRulesModal" class="modal-overlay" style="display:none;">
            <div class="modal-content glass-card" style="width:600px;">
                <h3>✨ 清洗规则</h3>
                <div id="cleanRulesList"></div>
                <div style="margin-top:16px; display:flex; gap:8px;"><button class="btn btn-ghost btn-sm"
                        onclick="addCleanRuleRow('trim')">✂️ Trim</button><button class="btn btn-ghost btn-sm"
                        onclick="addCleanRuleRow('replace')">🔄 Replace</button><button class="btn btn-ghost btn-sm"
                        onclick="addCleanRuleRow('prefix')">➕ Prefix</button><button class="btn btn-ghost btn-sm"
                        onclick="addCleanRuleRow('suffix')">➕ Suffix</button><button class="btn btn-ghost btn-sm"
                        onclick="addCleanRuleRow('regex_sub')">🔍 Regex Sub</button></div><button
                    class="btn btn-primary" onclick="confirmSaveCleanRules()" style="margin-top:24px;">保存</button>
            </div>
        </div>

        <script src="js/utils.js"></script>
        <script src="js/api.js"></script>
        <script src="js/flow.js"></script>
        <script src="js/tabs.js"></script>
        <script src="js/app.js"></script>
    </div>
</body>

</html>
